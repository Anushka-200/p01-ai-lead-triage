services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: p01
      POSTGRES_PASSWORD: p01
      POSTGRES_DB: p01
    ports:
      - "5433:5432"   # 5433 on the host so it never clashes with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
