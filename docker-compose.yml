services:
  app:
    build: .
    depends_on:
      - postgres
    env_file: .env
    environment:
      DATABASE_URL: postgresql://p01:p01@postgres:5432/p01
    ports:
      - "8000:8000"
    volumes:
      - ./secrets:/app/secrets:ro
      - ./logs:/app/logs

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: p01
      POSTGRES_PASSWORD: p01
      POSTGRES_DB: p01
    ports:
      - "5433:5432"   # 5433 on the host so it never clashes with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
