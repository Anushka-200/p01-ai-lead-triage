[project]
name = "p01-ai-lead-triage"
version = "0.1.0"
description = "AI lead and inbox triage: LLM extraction, dedupe, Sheets, Slack, DLQ"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "gspread>=6.2.1",
    "langfuse>=4.15.6",
    "litellm>=1.102.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "streamlit>=1.64.0",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
