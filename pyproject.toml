[project]
name = "p01-ai-lead-triage"
version = "0.1.0"
description = "AI lead and inbox triage: LLM extraction, dedupe, Sheets, Slack, DLQ"
requires-python = ">=3.12"
dependencies = [
    "langfuse>=4.15.6",
    "litellm>=1.102.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
